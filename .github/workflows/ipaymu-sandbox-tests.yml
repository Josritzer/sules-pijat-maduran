name: iPaymu Sandbox Tests

on:
  pull_request:
    paths:
      - "infra/ipaymu-proxy/**"
      - "supabase/functions/ipaymu-callback/**"
      - "supabase/functions/create-ipaymu-payment/**"
      - ".github/workflows/ipaymu-sandbox-tests.yml"
  push:
    branches:
      - "main"
      - "feat/ipaymu-redirect-sandbox"
    paths:
      - "infra/ipaymu-proxy/**"
      - "supabase/functions/ipaymu-callback/**"
      - "supabase/functions/create-ipaymu-payment/**"
      - ".github/workflows/ipaymu-sandbox-tests.yml"

permissions:
  contents: read

jobs:
  proxy-signature-tests:
    name: Proxy signature tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run proxy signature tests
        run: node --test infra/ipaymu-proxy/signature.test.mjs

  callback-helper-tests:
    name: Callback helper tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Run callback helper tests
        run: deno test supabase/functions/ipaymu-callback/callback-utils_test.ts

  payment-function-typecheck:
    name: Payment function typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Type-check payment function
        run: deno check supabase/functions/create-ipaymu-payment/index.ts
