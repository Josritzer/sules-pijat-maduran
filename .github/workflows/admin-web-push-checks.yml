name: Admin Web Push Checks

on:
  pull_request:
    paths:
      - "index.html"
      - "service-worker.js"
      - "supabase/functions/admin-push-config/**"
      - "supabase/functions/notify-booking/**"
      - "supabase/functions/github-monitoring-status/**"
      - "supabase/migrations/*admin_push_subscriptions.sql"
      - ".github/workflows/admin-web-push-checks.yml"
      - ".github/workflows/monitoring-queue-worker.yml"

permissions:
  contents: read

jobs:
  edge-function-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "v2.x"
      - name: Type-check Admin push config
        run: deno check supabase/functions/admin-push-config/index.ts
      - name: Type-check booking notification function
        run: deno check supabase/functions/notify-booking/index.ts
      - name: Type-check website monitoring function
        run: deno check supabase/functions/github-monitoring-status/index.ts

  service-worker-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check service worker JavaScript syntax
        run: node --check service-worker.js
