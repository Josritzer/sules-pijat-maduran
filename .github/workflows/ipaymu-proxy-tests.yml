name: iPaymu proxy tests

on:
  pull_request:
    paths:
      - "infra/ipaymu-proxy/**"
      - ".github/workflows/ipaymu-proxy-tests.yml"
  push:
    branches: [main]
    paths:
      - "infra/ipaymu-proxy/**"
      - ".github/workflows/ipaymu-proxy-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run proxy and signature tests
        run: node --test infra/ipaymu-proxy/signature.test.mjs infra/ipaymu-proxy/server.test.mjs
