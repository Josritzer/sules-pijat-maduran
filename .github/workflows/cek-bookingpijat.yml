name: Cek bookingpijat.com harian

on:
  schedule:
    # Setiap hari jam 08:00 WIB (= 01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Jalankan pengecekan
        run: node .github/scripts/cek-bookingpijat.js

      - name: Simpan laporan dan screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hasil-cek-${{ github.run_number }}
          path: |
            laporan.txt
            hasil-beranda.png
          if-no-files-found: warn
          retention-days: 30
