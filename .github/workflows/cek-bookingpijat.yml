name: Cek bookingpijat.com harian

on:
  schedule:
    # Setiap hari jam 08:00 WIB (= 01:00 UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cek:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Playwright
        run: |
          npm init -y
          npm install --no-audit --no-fund playwright
          npx playwright install --with-deps chromium

      - name: Jalankan pengecekan
        id: website_check
        continue-on-error: true
        run: node .github/scripts/cek-bookingpijat.js

      - name: Jalankan laporan terpadu alur booking
        if: always()
        continue-on-error: true
        run: node .github/scripts/cek-alur-booking.js

      - name: Kirim status ke Dashboard Admin
        if: always()
        continue-on-error: true
        env:
          SULES_MONITORING_SECRET: ${{ secrets.SULES_MONITORING_SECRET }}
        shell: bash
        run: |
          if [ -z "$SULES_MONITORING_SECRET" ]; then
            echo "Status Dashboard Admin belum dikirim: secret SULES_MONITORING_SECRET belum disetel." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          STATUS="failure"
          if [ "${{ steps.website_check.outcome }}" = "success" ]; then STATUS="success"; fi
          HTTP_STATUS="$(sed -n 's/^Status halaman: //p' laporan.txt 2>/dev/null | head -n 1)"
          case "$HTTP_STATUS" in *[!0-9]*|"") HTTP_STATUS="" ;; esac
          DURATION="$(sed -n 's/^Waktu pemeriksaan: \([0-9.]*\) detik.*/\1/p' laporan.txt 2>/dev/null | head -n 1)"
          case "$DURATION" in *[!0-9.]*|"") DURATION="" ;; esac
          jq -n \
            --arg status "$STATUS" \
            --arg checked_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg workflow_run_url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg commit_sha "$GITHUB_SHA" \
            --arg summary "$(head -n 12 laporan.txt 2>/dev/null || echo 'Laporan pemeriksaan tidak tersedia.')" \
            --arg http_status "$HTTP_STATUS" \
            --arg duration_seconds "$DURATION" \
            --arg workflow_run_id "$GITHUB_RUN_ID" \
            '{status:$status,checked_at:$checked_at,workflow_run_url:$workflow_run_url,commit_sha:$commit_sha,summary:$summary,http_status:(if $http_status == "" then null else ($http_status|tonumber) end),duration_seconds:(if $duration_seconds == "" then null else ($duration_seconds|tonumber) end),workflow_run_id:($workflow_run_id|tonumber)}' > monitoring-payload.json
          if curl --silent --show-error --fail --max-time 20 \
            -X POST "https://tzupkourtcmqemymszgt.supabase.co/functions/v1/github-monitoring-status" \
            -H "Content-Type: application/json" \
            -H "x-monitoring-secret: $SULES_MONITORING_SECRET" \
            --data-binary @monitoring-payload.json; then
            echo "Status pemeriksaan berhasil dikirim ke Dashboard Admin SL RELAX." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Peringatan: pengiriman status ke Dashboard Admin gagal; hasil Playwright tetap tersedia di artifact." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tandai workflow gagal bila pemeriksaan situs gagal
        if: always() && steps.website_check.outcome == 'failure'
        run: exit 1

      - name: Tampilkan laporan pada ringkasan Actions
        if: always()
        shell: bash
        run: |
          if [ -f laporan.txt ]; then
            {
              echo "## Hasil cek bookingpijat.com"
              echo
              cat laporan.txt
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Hasil cek bookingpijat.com" >> "$GITHUB_STEP_SUMMARY"
            echo "Laporan tidak dibuat. Periksa log job untuk penyebabnya." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tampilkan laporan terpadu alur booking\n        if: always()\n        shell: bash\n        run: |\n          if [ -f laporan-alur-booking.txt ]; then\n            { echo \"## Laporan terpadu alur booking\"; echo; cat laporan-alur-booking.txt; } >> \"$GITHUB_STEP_SUMMARY\"\n          else\n            echo \"Laporan terpadu alur booking belum tersedia.\" >> \"$GITHUB_STEP_SUMMARY\"\n          fi\n\n      - name: Simpan laporan dan screenshot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hasil-cek-${{ github.run_number }}
          path: |
            laporan.txt
            hasil-beranda.png
            laporan-alur-booking.txt
            hasil-alur-booking.json
          if-no-files-found: warn
          retention-days: 30
